[package]
authors = ["Bastien Dejean <nihilhill@gmail.com>"]
name = "plato-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bitflags.workspace = true
plato_error = { path = "../error" }
plato-ai = { path = "../ai" }
plato_search = { path = "../search" }
tokio = { version = "1.43", features = ["full"] }
downcast-rs = "2.0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tga"] }
libc = "0.2.186"
png = "0.18.1"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
titlecase = "3.6.0"
unicode-normalization = "0.1.25"
toml = "1.1.2"
zip.workspace = true
kl-hyphenate = "0.7.3"
entities = "1.0.1"
paragraph-breaker = "0.4.4"
xi-unicode = "0.3.0"
septem = "1.1.0"
num2words = "1.2.0"
byteorder = "1.5.0"
flate2 = "1.1.9"
levenshtein = "1.0.5"
nix.workspace = true
indexmap.workspace = true
anyhow.workspace = true
thiserror = "2.0.18"
walkdir = "2.5.0"
globset = "0.4.18"
rustc-hash = "2.1.2"
validator = { version = "0.20.0", features = ["derive"] }
rand_core = "0.10.1"
rand_xoshiro = "0.8.0"
percent-encoding = "2.3.2"
chrono = { version = "0.4.44", features = ["serde", "clock"], default-features = false }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls", "multipart", "query"] }
url = "2.5.0"
quick-xml = "0.39.2"
epub_edit = { path = "../epub_edit" }
lru = "0.18.0"
dashmap = "6.1.0"
smallvec = { version = "1.15.1", features = ["serde"] }
dirs-next = "2.0.0"

# TTS dependencies (optional, enabled via 'tts' or 'tts-android' features)
# Desktop TTS uses the 'tts' crate
# Android TTS uses jni/ndk-context which depend on ndk-sys (Android only)
tts = { version = "0.26.3", optional = true }
jni = { version = "0.22.4", optional = true }
ndk-context = { version = "0.1.1", optional = true }

# Pure Rust compression and image libraries (replaces C libraries)
bzip2 = "0.6.1"
justjp2 = "0.1.1"
hayro-jbig2 = "0.3.0"
djvu-rs = "0.16.1"
rar = { path = "../rar" }  # CBR support (pure Rust)
tempfile = "3.15.0"  # Temp directory support

# Rust-native font stack (replaces FreeType + HarfBuzz)
skrifa = "0.42.1"
rustybuzz = "0.20.1"

# Pure Rust PDF library (replaces MuPDF)
pdfpurr = { version = "0.4.0", features = ["ocr"] }
tiny-skia = "0.12.0"
lopdf = "0.40.0"
hex = "0.4.3"

# Linux only dependencies (cryptographic signatures)
[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.11.0"
x509-cert = "0.2.5"

# Linux desktop windowing (Wayland/X11)
[target.'cfg(all(target_os = "linux", not(any(target_arch = "arm", target_arch = "aarch64"))))'.dependencies]
minifb = "0.28.0"

[features]
default = []
ocr = ["pdfpurr/ocr"]
# Desktop TTS - works on Linux/macOS/Windows
tts = ["dep:tts"]
# Android TTS - requires jni (pulls in ndk-sys which only compiles for Android)
# Use this feature when building for Android target
tts-android = ["dep:tts", "dep:jni", "dep:ndk-context"]

[dev-dependencies]
tempfile = "3.27.0"
