[package]
authors = ["Bastien Dejean <nihilhill@gmail.com>"]
name = "plato-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bitflags.workspace = true
downcast-rs = "2.0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tga"] }
lazy_static = "1.5.0"
libc = "0.2.186"
png = "0.18.1"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
titlecase = "3.6.0"
unicode-normalization = "0.1.25"
toml = "1.1.2"
zip.workspace = true
kl-hyphenate = "0.7.3"
entities = "1.0.1"
paragraph-breaker = "0.4.4"
xi-unicode = "0.3.0"
septem = "1.1.0"
num2words = "1.2.0"
byteorder = "1.5.0"
flate2 = "1.1.9"
levenshtein = "1.0.5"
nix.workspace = true
indexmap.workspace = true
anyhow.workspace = true
thiserror = "2.0.18"
walkdir = "2.5.0"
globset = "0.4.18"
rustc-hash = "2.1.2"
validator = { version = "0.20.0", features = ["derive"] }
rand_core = "0.10.1"
rand_xoshiro = "0.8.0"
percent-encoding = "2.3.2"
chrono = { version = "0.4.44", features = ["serde", "clock"], default-features = false }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
quick-xml = "0.39.2"
epub_edit = { path = "../epub_edit" }
lru = "0.17.0"
dashmap = "6.1.0"
smallvec = { version = "1.15.1", features = ["serde"] }
dirs-next = "2.0.0"

# TTS dependencies (optional, enabled via 'tts' feature)
tts = { version = "0.26.0", optional = true }
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }

# Pure Rust compression and image libraries (replaces C libraries)
bzip2 = "0.6.1"
html5ever = "0.39.0"
justjp2 = "0.1.1"
hayro-jbig2 = "0.3.0"
djvu-rs = "0.13.0"

# Rust-native font stack (replaces FreeType + HarfBuzz)
skrifa = "0.42.1"
rustybuzz = "0.20.1"
ab_glyph = { version = "0.2.32", features = ["variable-fonts"] }

# Pure Rust PDF library (replaces MuPDF)
pdfpurr = { version = "0.4.0", features = ["ocr"], optional = true }
tiny-skia = "0.12.0"
lopdf = "0.40.0"
hex = "0.4.3"

[features]
default = []
ocr = ["pdfpurr/ocr"]
tts = ["dep:tts", "dep:jni", "dep:ndk-context"]

# Cryptographic operations for digital signatures (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
ring = "0.17.14"
x509-cert = "0.2.5"
der = { version = "0.7", features = ["pem", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
