[package]
name = "plato-ai"
version = "0.1.0"
edition = "2021"
description = "AI features for Plato e-reader (local-first, privacy-focused)"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }

# HTTP client for Ollama/local LLM and cloud providers
reqwest = { version = "0.13", features = ["json", "blocking"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
plato_error = { path = "../error" }

# Logging
log = "0.4"

# Optional: OpenAI-compatible API support
# openai-api = { version = "0.2", optional = true }

# SQLite for caching
rusqlite = { version = "0.33", features = ["bundled"] }

# Vector embedding library
candle-core = "0.8.3"
candle-nn = "0.8.3"
tokenizers = "0.21.0"

[dev-dependencies]
tempfile = "3.15"

[features]
default = []
cloud = [] # Enable cloud provider support (OpenAI, Claude, etc.)
# local = ["dep:ollama"] # Enable local LLM support

[lib]
name = "plato_ai"
path = "src/lib.rs"
