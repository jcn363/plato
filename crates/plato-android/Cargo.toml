[package]
name = "plato-android"
version = "0.9.45"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Enable Android TTS via tts-android feature (includes jni for TextToSpeech API)
plato-core = { path = "../core", features = ["tts-android"] }
android-activity = { version = "0.6.1", features = ["native-activity"], optional = true }
ndk = { version = "0.9.0", features = ["nativewindow"], optional = true }
ndk-context = { version = "0.1.1", optional = true }
android_logger = { version = "0.15.1", optional = true }
log = "0.4.29"
anyhow = "1.0.102"

[features]
default = ["android"]
android = ["android-activity", "ndk", "ndk-context", "android_logger"]
