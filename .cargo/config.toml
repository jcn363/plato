# ARM 32-bit target: uses libs/ directory for 32-bit shared libraries
[target.arm-unknown-linux-gnueabihf]
linker = 'arm-linux-gnueabihf-gcc'
rustflags = [
    '-C', 'link-args=-L../../libs -Wl,-rpath-link=../../libs',
    '-C', 'target-cpu=cortex-a7',
    '--cap-lints', 'warn',
]

# ARM 64-bit target: uses libs64/ directory for 64-bit shared libraries
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "link-args=-L../../libs64 -Wl,-rpath-link=../../libs64",
    "-C", "target-cpu=generic",
]

[build]
target = "arm-unknown-linux-gnueabihf"

# Android ARM 64-bit target
[target.aarch64-linux-android]
ar = "/home/user/Android/sdk/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
linker = "/home/user/Android/sdk/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-landroid"]

# Android ARM 32-bit target  
[target.armv7-linux-androideabi]
ar = "/home/user/Android/sdk/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
linker = "/home/user/Android/sdk/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
rustflags = ["-C", "link-arg=-landroid"]
