name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: false
        default: 'universal'
        type: choice
        options:
          - device
          - simulator
          - universal

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

    - name: Build native dependencies for iOS
      run: |
        echo "Building native libraries for iOS..."
        echo "This step currently requires manual implementation"
        echo "Native libraries needed: mupdf, freetype, harfbuzz, gumbo, zlib, bzip2, libpng, libjpeg, openjpeg, jbig2dec"
        echo "See build-ios.sh and mupdf_wrapper/build-ios.sh for reference"
        # TODO: Implement native library build for iOS
        # cd thirdparty && ./build-ios.sh
        # cd ../mupdf_wrapper && ./build-ios.sh

    - name: Build Rust core for iOS device
      run: |
        cargo build --target aarch64-apple-ios --release -p plato-core

    - name: Build Rust core for iOS simulator (ARM64)
      run: |
        cargo build --target aarch64-apple-ios-sim --release -p plato-core

    - name: Build Rust core for iOS simulator (x86_64)
      run: |
        cargo build --target x86_64-apple-ios --release -p plato-core

    - name: Create universal library
      run: |
        mkdir -p target/universal
        lipo -create \
          target/aarch64-apple-ios/release/libplato_core.a \
          target/aarch64-apple-ios-sim/release/libplato_core.a \
          target/x86_64-apple-ios/release/libplato_core.a \
          -output target/universal/libplato_core.a || echo "Universal library creation failed - some targets may not have built"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-libraries
        path: |
          target/aarch64-apple-ios/release/libplato_core.a
          target/aarch64-apple-ios-sim/release/libplato_core.a
          target/x86_64-apple-ios/release/libplato_core.a
