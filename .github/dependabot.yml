version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "dev-dependencies"
          - "build-dependencies"
    reviewers:
      - "team"
    versioning-strategy: "increase"