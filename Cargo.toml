[workspace]
resolver = '2'
members = [
  'crates/core',
  'crates/plato',
  'crates/importer',
  'crates/fetcher',
  'crates/epub_edit',
  'crates/epub_editor',
  'crates/plato-ios',
  'crates/plato-android',
  'crates/ai',
  'crates/rar',
  'crates/plato-document',
  'crates/plato-library',
  'crates/error',
  'crates/thumbnail',
  'crates/search',
  'crates/config',
  'crates/device',
  'crates/utils',
  'crates/network',
  'crates/plugin',
  'crates/plato-view',
  'crates/metadata',
  'crates/font',
  'crates/doc',
  'crates/ui',
  'crates/theme',
  'crates/color',
  'crates/geom',
  'crates/sync',
]

[workspace.package]
edition = '2021'
version = '0.9.45'
license = 'MIT'

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
env_logger = "0.11.10"
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
nix = { version = "0.31.2", features = ["fs", "ioctl"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }
zip = "8.6.0"
