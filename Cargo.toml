[workspace]
resolver = '2'
members = [
  'crates/core',
  'crates/plato',
  'crates/importer',
  'crates/fetcher',
  'crates/epub_edit',
  'crates/epub_editor',
  'crates/plato-ios',
  # 'crates/plato-android' - excluded from workspace; build separately with:
  # cargo build -p plato-android --target aarch64-linux-android
  'crates/ai',
  'crates/rar',
  'crates/plato-document',
  'crates/error',
  'crates/thumbnail',
  'crates/search',
  'crates/config',
  'crates/device',
  'crates/utils',
  'crates/network',
  'crates/plugin',
  'crates/metadata',
  'crates/font',
  'crates/doc',
  'crates/ui',
  'crates/theme',
  'crates/color',
  'crates/geom',
  'crates/sync',
  'crates/input',
  'crates/gesture',
  'crates/battery',
  'crates/frontlight',
  'crates/opds',
  'crates/settings',
  'crates/tts',
  'crates/validation',
  'crates/buffer_pool',
  'crates/consts',
  'crates/rtc',
  'crates/framebuffer',
  'crates/helpers',
  'crates/eink',
]

[workspace.package]
edition = '2021'
version = '0.9.45'
license = 'MIT'

[profile.release-arm]
inherits = "release"

[profile.release-arm64]
inherits = "release"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
env_logger = "0.11.10"
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.29"
nix = { version = "0.31.2", features = ["fs", "ioctl"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }
rustc-hash = "2.1.2"
zip = "8.6.0"
